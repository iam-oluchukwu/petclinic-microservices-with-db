apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o petclinic_chart/templates
    kompose.image-pull-secret: regcred
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: discovery-server
  name: discovery-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: discovery-server
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o petclinic_chart/templates
        kompose.image-pull-secret: regcred
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: discovery-server
    spec:
      containers:
      - image: '{{ .Values.IMAGE_TAG_DISCOVERY_SERVER }}'
        name: discovery-server
        ports:
        - containerPort: 8761
          protocol: TCP
      imagePullSecrets:
      - name: regcred
      restartPolicy: Always
      initContainers:
      - name: wait-for-config-server
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z config-server 8888; do echo waiting for config-server; sleep
          2; done
