apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o petclinic_chart/templates
    kompose.image-pull-secret: regcred
    kompose.service.expose: '{{ .Values.DNS_NAME }}'
    kompose.service.nodeport.port: '30001'
    kompose.service.type: nodeport
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: api-gateway
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: api-gateway
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o petclinic_chart/templates
        kompose.image-pull-secret: regcred
        kompose.service.expose: '{{ .Values.DNS_NAME }}'
        kompose.service.nodeport.port: '30001'
        kompose.service.type: nodeport
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: api-gateway
    spec:
      containers:
      - image: '{{ .Values.IMAGE_TAG_API_GATEWAY }}'
        name: api-gateway
        ports:
        - containerPort: 8080
          protocol: TCP
      imagePullSecrets:
      - name: regcred
      restartPolicy: Always
      initContainers:
      - name: wait-for-discovery-server
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z discovery-server 8761; do echo waiting for discovery-server;
          sleep 2; done
