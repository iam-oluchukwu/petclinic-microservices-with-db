apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o petclinic_chart/templates
    kompose.image-pull-secret: regcred
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: vets-service
  name: vets-service
spec:
  replicas: 2
  selector:
    matchLabels:
      io.kompose.service: vets-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o petclinic_chart/templates
        kompose.image-pull-secret: regcred
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: vets-service
    spec:
      containers:
      - image: '{{ .Values.IMAGE_TAG_VETS_SERVICE }}'
        name: vets-service
        env:
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: petclinic-mysql-credentials
              key: root-password
        ports:
        - containerPort: 8083
          protocol: TCP
      imagePullSecrets:
      - name: regcred
      restartPolicy: Always
      initContainers:
      - name: wait-for-discovery-server
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z discovery-server 8761; do echo waiting for discovery-server;
          sleep 2; done
