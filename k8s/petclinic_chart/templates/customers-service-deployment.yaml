
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o petclinic_chart/templates
    kompose.image-pull-secret: regcred
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: customers-service
  name: customers-service

spec:
  replicas: 2
  selector:
    matchLabels:
      io.kompose.service: customers-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o petclinic_chart/templates
        kompose.image-pull-secret: regcred
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: customers-service
    spec:
      containers:
        - name: customers-service
          image: '{{ .Values.IMAGE_TAG_CUSTOMERS_SERVICE }}'
          ports:
            - containerPort: 8081
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-server:3306/petclinic?sslMode=REQUIRED"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: petclinic-mysql-credentials
                  key: root-password

      imagePullSecrets:
        - name: regcred

      restartPolicy: Always

      initContainers:
        - name: wait-for-discovery-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z discovery-server 8761; do
                echo "Waiting for discovery-server"
                sleep 2
              done

        - name: wait-for-mysql-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql-server 3306; do
                echo "Waiting for MySQL"
                sleep 2
              done
