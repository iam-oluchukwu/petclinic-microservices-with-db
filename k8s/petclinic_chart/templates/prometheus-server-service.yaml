apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o petclinic_chart/templates
    kompose.image-pull-secret: regcred
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: prometheus-server
  name: prometheus-server
spec:
  type: NodePort
  ports:
    - name: "http"
      port: 9090
      targetPort: 9090
      protocol: TCP
      nodePort: 30002
  selector:
    io.kompose.service: prometheus-server
