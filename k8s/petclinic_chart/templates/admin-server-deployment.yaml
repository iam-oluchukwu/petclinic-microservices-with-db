apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o petclinic_chart/templates
    kompose.image-pull-secret: regcred
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: admin-server
  name: admin-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: admin-server
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o petclinic_chart/templates
        kompose.image-pull-secret: regcred
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: admin-server
    spec:
      containers:
      - image: '{{ .Values.IMAGE_TAG_ADMIN_SERVER }}'
        name: admin-server
        ports:
        - containerPort: 9090
          protocol: TCP
      imagePullSecrets:
      - name: regcred
      restartPolicy: Always
      initContainers:
      - name: wait-for-discovery-server
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z discovery-server 8761; do echo waiting for discovery-server;
          sleep 2; done
