---
- name: Run Dummy Selenium Test
  hosts: all
  gather_facts: false

  tasks:
    - name: Run dummy Selenium job
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -v
          - "{{ workspace }}:{{ workspace }}"
          - -w
          - "{{ workspace }}"
          - clarusway/selenium-py-chrome:latest
          - python
          - "{{ item }}"
      loop: "{{ query('fileglob', workspace ~ '/selenium-jobs/dummy*.py') }}"
      register: output

    - name: Show Selenium test results
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ output.results }}"
      loop_control:
        label: "{{ item.item }}"
